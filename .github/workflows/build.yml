name: Build and Release nginx

on:
  schedule:
    - cron: "7 19 * * *" # 03:07 UTC+8
  workflow_dispatch: {}

concurrency:
  group: nginx-build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      need: ${{ steps.up.outputs.need }}
      nginx: ${{ steps.up.outputs.nginx }}
      openssl: ${{ steps.up.outputs.openssl }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect latest versions
        id: up
        run: |
          set +e
          OUT=$(./scripts/check-update.sh)
          rc=$?
          set -e
          # 0 builds, 1 skips, and 2 fails the check.
          echo "$OUT" >&2
          case "$rc" in
            0)
              NGINX=$(echo "$OUT" | sed -n 's/^LATEST_NGINX=//p')
              SSL=$(echo "$OUT" | sed -n 's/^LATEST_SSL=//p')
              [[ -n "$NGINX" && -n "$SSL" ]] || { echo "detection returned no versions" >&2; exit 2; }
              echo "need=yes" >> "$GITHUB_OUTPUT"
              echo "nginx=$NGINX" >> "$GITHUB_OUTPUT"
              echo "openssl=$SSL" >> "$GITHUB_OUTPUT"
              ;;
            1)
              echo "need=no" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "detection failed (rc=$rc)" >&2
              exit "$rc"
              ;;
          esac

  build:
    needs: check
    if: needs.check.outputs.need == 'yes'
    runs-on: ubuntu-latest
    container:
      image: debian:13
    outputs:
      nginx: ${{ needs.check.outputs.nginx }}
      openssl: ${{ needs.check.outputs.openssl }}
    env:
      NGINX_VER: ${{ needs.check.outputs.nginx }}
      SSL_VER: ${{ needs.check.outputs.openssl }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config git curl cmake perl ca-certificates \
            zlib1g-dev libpcre2-dev libjemalloc-dev
          rm -rf /var/lib/apt/lists/*

      - name: Build static zstd (linked into nginx, no runtime libzstd)
        run: |
          WORK="$GITHUB_WORKSPACE/src"
          mkdir -p "$WORK" && cd "$WORK"
          git clone --depth 1 https://github.com/facebook/zstd.git zstd
          cd zstd
          make -C lib -j"$(nproc)" libzstd.a-release
          make -C lib PREFIX=/usr/local install-static install-includes

      - name: Download sources
        run: |
          WORK="$GITHUB_WORKSPACE/src"
          mkdir -p "$WORK" && cd "$WORK"
          curl --connect-timeout 10 --max-time 120 --retry 3 -fsSL \
            "https://nginx.org/download/nginx-${NGINX_VER}.tar.gz" | tar -xz
          curl --connect-timeout 10 --max-time 120 --retry 3 -fsSL \
            "https://www.openssl.org/source/openssl-${SSL_VER}.tar.gz" | tar -xz
          git clone --depth 1 --recursive https://github.com/google/ngx_brotli.git
          git clone --depth 1 https://github.com/tokers/zstd-nginx-module.git

      - name: Build static brotli lib
        run: |
          WORK="$GITHUB_WORKSPACE/src"
          cd "$WORK/ngx_brotli/deps/brotli"
          mkdir -p out && cd out
          cmake -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_C_FLAGS="-Ofast -flto -funroll-loops" \
            -DCMAKE_CXX_FLAGS="-Ofast -flto -funroll-loops" ..
          cmake --build . --config Release --target brotlienc

      - name: Configure and build nginx
        run: |
          WORK="$GITHUB_WORKSPACE/src"
          cd "$WORK/nginx-${NGINX_VER}"
          cores=$(nproc)
          # Link zstd statically and jemalloc dynamically; option order is significant.
          ./configure \
            --prefix=/usr/local/nginx \
            --user=nginx --group=nginx \
            --conf-path=/etc/nginx/nginx.conf \
            --error-log-path=/var/log/nginx/error.log \
            --http-log-path=/var/log/nginx/access.log \
            --pid-path=/run/nginx.pid \
            --lock-path=/run/lock/nginx.lock \
            --http-client-body-temp-path=/var/cache/nginx/client_temp \
            --http-proxy-temp-path=/var/cache/nginx/proxy_temp \
            --http-fastcgi-temp-path=/var/cache/nginx/fastcgi_temp \
            --http-uwsgi-temp-path=/var/cache/nginx/uwsgi_temp \
            --http-scgi-temp-path=/var/cache/nginx/scgi_temp \
            --with-threads --with-file-aio \
            --with-http_ssl_module --with-http_v2_module --with-http_v3_module \
            --with-http_realip_module --with-http_gzip_static_module \
            --with-http_stub_status_module \
            --with-pcre-jit \
            --with-ld-opt="-L/usr/local/lib -Wl,-Bstatic -lzstd -Wl,-Bdynamic -ljemalloc" \
            --with-openssl="../openssl-${SSL_VER}" \
            --with-openssl-opt="no-shared enable-tls1_3" \
            --add-module=../ngx_brotli \
            --add-module=../zstd-nginx-module
          make -j"$cores"
          ./objs/nginx -V

      - name: Package
        run: |
          WORK="$GITHUB_WORKSPACE/src"
          STAGE="$GITHUB_WORKSPACE/stage"
          mkdir -p "$STAGE/sbin" "$STAGE/conf"
          cp "$WORK/nginx-${NGINX_VER}/objs/nginx" "$STAGE/sbin/nginx"
          cp "$WORK/nginx-${NGINX_VER}/conf/mime.types" "$STAGE/conf/mime.types"
          echo "nginx-${NGINX_VER}-openssl-${SSL_VER}" > "$STAGE/.versions"
          tar -czf "$GITHUB_WORKSPACE/nginx-${NGINX_VER}-openssl-${SSL_VER}.tar.gz" \
            -C "$STAGE" sbin conf .versions

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          path: nginx-*.tar.gz
          name: nginx-run

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NGINX_VER: ${{ needs.build.outputs.nginx }}
      SSL_VER: ${{ needs.build.outputs.openssl }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nginx-run

      - name: Generate checksum and sign
        env:
          GPG_PRIVATE: ${{ secrets.NGINX_GPG_PRIVATE }}
        run: |
          TARBALL=$(ls -1 nginx-*.tar.gz | head -1)
          sha256sum "$TARBALL" > SHA256SUMS
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p "$GNUPGHOME" && chmod 700 "$GNUPGHOME"
          echo "$GPG_PRIVATE" | gpg --batch --import
          gpg --batch --yes --detach-sign "$TARBALL"
          gpg --batch --yes --detach-sign SHA256SUMS
          ls -la

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="nginx-${NGINX_VER}-openssl-${SSL_VER}"
          TARBALL=$(ls -1 nginx-*.tar.gz | head -1)
          if gh release view "$TAG" >/dev/null 2>&1; then
            assets=$(gh release view "$TAG" --json assets --jq '.assets[].name') || {
              echo "could not inspect existing release $TAG" >&2
              exit 1
            }
            for asset in "$TARBALL" "$TARBALL.sig" SHA256SUMS SHA256SUMS.sig; do
              grep -Fqx "$asset" <<< "$assets" || {
                echo "existing release $TAG is missing asset: $asset" >&2
                exit 1
              }
            done
            echo "release $TAG already exists with all expected assets; adopting it" >&2
          else
            gh release create "$TAG" \
              --title "nginx-$NGINX_VER (openssl $SSL_VER)" \
              --notes "Auto-built. nginx $NGINX_VER / OpenSSL $SSL_VER" \
              "$TARBALL" "$TARBALL.sig" SHA256SUMS SHA256SUMS.sig
          fi

      - name: Bump published version
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          jq -n --arg n "$NGINX_VER" --arg s "$SSL_VER" \
            '{_comment:"The last successfully published version. The check script compares upstream latest against this before building; it is advanced only after a release succeeds. The host does not read this file.",nginx:$n,openssl:$s}' \
            > versions.json
          git add versions.json
          git commit -m "release: nginx $NGINX_VER / openssl $SSL_VER"
          git push
